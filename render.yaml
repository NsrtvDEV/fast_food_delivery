databases:
  - name: foodify-db
    plan: free
    region: oregon

services:
  - name: foodify-api
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    dockerCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: PROJECT_NAME
        value: fast_food_delivery
      - key: DEBUG
        value: "0"
      - key: BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: EMAIL_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SETUP_TOKEN
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: foodify-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: foodify-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: foodify-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: foodify-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: foodify-db
          property: password
      # Redis is a free managed instance (e.g. Upstash), not hosted on
      # Render, since Render's free tier has no Background Worker or Key
      # Value option - only this manually-entered connection string.
      - key: REDIS_URL
        sync: false
